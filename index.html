<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 Мой бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg-secondary: #f0f0f0;
            --bg-chat: #ffffff;
            --text: #000000;
            --text-secondary: #8e8e93;
            --border: #e5e5ea;
            --blue: #007aff;
            --green: #34c759;
            --red: #ff3b30;
            --orange: #ff9500;
            --purple: #5856d6;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #1c1c1e;
            --bg-secondary: #2c2c2e;
            --bg-chat: #1c1c1e;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --border: #38383a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ========== ШАПКА ========== */
        .header {
            background: var(--bg-secondary);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 50px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .header .back-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--blue);
            padding: 4px;
            display: none;
        }

        .header .back-btn.show {
            display: block;
        }

        .header .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .header .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .header .chat-header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header .chat-header-text {
            flex: 1;
            min-width: 0;
        }

        .header .title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            color: var(--text);
        }

        .header-actions button:hover {
            background: var(--border);
        }

        .badge-online {
            background: var(--green);
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 4px;
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ========== БОКОВАЯ ПАНЕЛЬ ========== */
        .sidebar {
            width: 320px;
            min-width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-search {
            padding: 8px 12px;
            flex-shrink: 0;
        }

        .sidebar-search input {
            width: 100%;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .sidebar-search input::placeholder {
            color: var(--text-secondary);
        }

        .sidebar-tabs {
            display: flex;
            padding: 0 12px 6px;
            gap: 4px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-tabs .tab {
            flex: 1;
            padding: 5px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            background: none;
            border: none;
        }

        .sidebar-tabs .tab.active {
            color: var(--text);
            background: var(--bg);
            box-shadow: 0 1px 3px var(--shadow);
        }

        .sidebar-tabs .tab:hover {
            background: var(--bg);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .chat-item:hover {
            background: var(--bg);
        }

        .chat-item.active {
            background: var(--bg);
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-avatar.group {
            background: var(--green);
        }

        .chat-avatar.channel {
            background: var(--orange);
        }

        .chat-avatar .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--bg-secondary);
        }

        .chat-avatar .online-dot.online {
            background: var(--green);
        }

        .chat-avatar .online-dot.offline {
            background: #8e8e93;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info .chat-name {
            font-weight: 500;
            font-size: 14px;
        }

        .chat-info .chat-last {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .chat-meta .chat-time {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .chat-meta .chat-badge {
            background: var(--blue);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 12px;
            margin-top: 2px;
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ========== ОБЛАСТЬ ЧАТА ========== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .chat-area-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
        }

        .chat-area-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .chat-area-empty h3 {
            color: var(--text);
            font-size: 18px;
            margin-bottom: 4px;
        }

        .chat-area-empty p {
            font-size: 14px;
        }

        /* ========== СООБЩЕНИЯ ========== */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-chat);
        }

        .message {
            max-width: 75%;
            padding: 7px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: messageIn 0.2s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.outgoing {
            align-self: flex-end;
            background: var(--blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.incoming {
            align-self: flex-start;
            background: var(--bg-secondary);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message .msg-time {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 3px;
            display: block;
            text-align: right;
        }

        .message.outgoing .msg-time {
            color: rgba(255,255,255,0.7);
        }

        .message .msg-sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--blue);
            margin-bottom: 2px;
            display: block;
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* ========== МЕДИА СООБЩЕНИЯ ========== */
        .message .media-content {
            margin: 4px 0;
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
        }

        .message .media-content img,
        .message .media-content video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: block;
        }

        .message .media-content .sticker {
            max-width: 128px;
            max-height: 128px;
            display: block;
        }

        .message .media-content .video-note {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
        }

        .message .media-caption {
            margin-top: 4px;
        }

        .message .media-file {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            color: var(--text);
        }

        .message .media-file:hover {
            background: rgba(0,0,0,0.1);
        }

        /* ========== ВВОД ========== */
        .input-area {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area .input-wrapper {
            flex: 1;
            display: flex;
            background: var(--bg);
            border-radius: 20px;
            padding: 3px 3px 3px 14px;
            align-items: flex-end;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .input-area .input-wrapper:focus-within {
            border-color: var(--blue);
        }

        .input-area textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            padding: 7px 0;
            max-height: 80px;
            min-height: 18px;
            background: transparent;
            color: var(--text);
        }

        .input-area textarea::placeholder {
            color: var(--text-secondary);
        }

        .input-area .send-btn {
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-area .send-btn:active {
            transform: scale(0.9);
        }

        .input-area .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-area .attach-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .input-area .attach-btn:hover {
            transform: scale(1.1);
        }

        /* ========== МОДАЛ ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--bg);
            border-radius: 14px;
            padding: 20px;
            max-width: 400px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h3 {
            margin-bottom: 14px;
            font-size: 17px;
        }

        .modal .form-group {
            margin-bottom: 12px;
        }

        .modal .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            font-family: inherit;
        }

        .modal .form-group input:focus,
        .modal .form-group select:focus,
        .modal .form-group textarea:focus {
            border-color: var(--blue);
        }

        .modal .form-group textarea {
            resize: vertical;
            min-height: 50px;
        }

        .modal .form-group .file-input {
            padding: 10px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .modal .form-group .file-input:hover {
            border-color: var(--blue);
        }

        .modal .form-group .file-input input[type="file"] {
            display: none;
        }

        .modal .btn-modal {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .modal .btn-modal.primary {
            background: var(--blue);
            color: white;
        }

        .modal .btn-modal.secondary {
            background: var(--bg-secondary);
            color: var(--text);
            margin-top: 6px;
        }

        .modal .btn-modal:active {
            transform: scale(0.97);
        }

        .modal .btn-modal:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal .media-preview {
            margin: 10px 0;
            text-align: center;
        }

        .modal .media-preview img,
        .modal .media-preview video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
            }

            .sidebar.hidden {
                display: none;
            }

            .chat-area {
                width: 100%;
            }

            .message {
                max-width: 85%;
            }

            .header .title {
                font-size: 15px;
            }

            .message .media-content .sticker {
                max-width: 96px;
                max-height: 96px;
            }

            .message .media-content .video-note {
                width: 100px;
                height: 100px;
            }
        }

        @media (min-width: 769px) {
            .sidebar {
                display: flex !important;
            }
        }

        /* ========== SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* ========== ТОСТ ========== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 2000;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid var(--border);
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
        }

        /* ========== ЗАГРУЗКА ========== */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- ========== ШАПКА ========== -->
    <header class="header">
        <div class="header-left">
            <button class="back-btn" id="backBtn" onclick="showChatList()">‹</button>
            <div class="chat-header-info">
                <div class="chat-header-avatar" id="headerAvatar">🤖</div>
                <div class="chat-header-text">
                    <div class="title" id="chatTitle">Мой бот</div>
                    <div class="subtitle" id="chatSubtitle">Онлайн: <span id="onlineCount">0</span></div>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button onclick="updateContacts()" title="Обновить">🔄</button>
            <button onclick="toggleTheme()" title="Тема">🌓</button>
        </div>
    </header>

    <!-- ========== ОСНОВНОЙ КОНТЕЙНЕР ========== -->
    <div class="main-container">

        <!-- ====== БОКОВАЯ ПАНЕЛЬ ====== -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="🔍 Поиск..." oninput="filterChats()">
            </div>
            <div class="sidebar-tabs">
                <button class="tab active" onclick="switchTab('all', this)">Все</button>
                <button class="tab" onclick="switchTab('user', this)">👤 Контакты</button>
                <button class="tab" onclick="switchTab('group', this)">👥 Группы</button>
                <button class="tab" onclick="switchTab('channel', this)">📢 Каналы</button>
            </div>
            <div class="chats-list" id="chatsList"></div>
        </div>

        <!-- ====== ОБЛАСТЬ ЧАТА ====== -->
        <div class="chat-area" id="chatArea">
            <div class="chat-area-empty" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>Выберите чат</h3>
                <p>Выберите чат из списка слева</p>
            </div>
            <div class="messages-container" id="messagesContainer" style="display:none;"></div>
            <div class="input-area" id="inputArea" style="display:none;">
                <button class="attach-btn" onclick="openAttachModal()">📎</button>
                <div class="input-wrapper">
                    <textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ========== ТОСТ ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== МОДАЛ ВЛОЖЕНИЙ ========== -->
    <div class="modal-overlay" id="attachModal">
        <div class="modal">
            <h3>📎 Отправить медиа</h3>
            
            <div class="form-group">
                <label>Тип</label>
                <select id="attachType" onchange="toggleAttachFields()">
                    <option value="photo">🖼 Фото</option>
                    <option value="video">🎥 Видео</option>
                    <option value="sticker">😊 Стикер</option>
                    <option value="video_note">⭕ Кружок (Video Note)</option>
                    <option value="document">📄 Документ</option>
                </select>
            </div>

            <div class="form-group">
                <label>Файл</label>
                <div class="file-input" onclick="document.getElementById('fileInput').click()">
                    <div id="filePreview">📤 Нажмите для выбора файла</div>
                    <input type="file" id="fileInput" accept="image/*,video/*" onchange="previewFile(this)">
                </div>
            </div>

            <div class="media-preview" id="mediaPreview"></div>

            <div class="form-group" id="captionGroup">
                <label>Подпись (опционально)</label>
                <textarea id="captionText" rows="2" placeholder="Введите подпись..."></textarea>
            </div>

            <button class="btn-modal primary" onclick="sendMedia()">📤 Отправить</button>
            <button class="btn-modal secondary" onclick="closeModal('attachModal')">Отмена</button>
            <div id="attachResult" style="margin-top:8px;font-size:13px;text-align:center;"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. КОНФИГУРАЦИЯ
        // ============================================================
        const BOT_TOKEN = "8953225877:AAFjsj8bJgMni7EkAM0L2w36xBBRR2tdDv8";

        // ============================================================
        // 2. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        // Тема
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // ============================================================
        // 3. ДАННЫЕ
        // ============================================================
        let contacts = [];
        let messages = {};
        let currentChat = null;
        let currentTab = 'all';
        let lastUpdateId = 0;
        let updateInterval = null;
        let selectedFile = null;
        let chatAvatars = {};

        // ============================================================
        // 4. API ВЫЗОВЫ
        // ============================================================
        async function callTelegramAPI(method, params = {}) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/${method}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                
                const data = await response.json();
                if (!data.ok) {
                    console.error('Telegram API Error:', data);
                    showToast(`❌ ${data.description || 'Ошибка'}`);
                }
                return data;
            } catch (error) {
                console.error('Network Error:', error);
                showToast('❌ Ошибка сети');
                return { ok: false, error: error.message };
            }
        }

        async function sendFileToTelegram(chatId, file, type, caption = '') {
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append(type, file);
            if (caption) formData.append('caption', caption);

            const methodMap = {
                'photo': 'sendPhoto',
                'video': 'sendVideo',
                'sticker': 'sendSticker',
                'video_note': 'sendVideoNote',
                'document': 'sendDocument'
            };

            const method = methodMap[type] || 'sendDocument';
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/${method}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (!data.ok) {
                    showToast(`❌ ${data.description || 'Ошибка'}`);
                }
                return data;
            } catch (error) {
                showToast('❌ Ошибка отправки файла');
                return { ok: false, error: error.message };
            }
        }

        // ============================================================
        // 5. ПОЛУЧЕНИЕ ОБНОВЛЕНИЙ
        // ============================================================
        async function getUpdates() {
            const params = {
                timeout: 30,
                allowed_updates: ['message', 'channel_post', 'my_chat_member']
            };

            if (lastUpdateId > 0) {
                params.offset = lastUpdateId + 1;
            }

            const result = await callTelegramAPI('getUpdates', params);
            
            if (result.ok && result.result) {
                for (const update of result.result) {
                    lastUpdateId = Math.max(lastUpdateId, update.update_id);
                    
                    const msg = update.message || update.channel_post;
                    if (msg) {
                        await processNewMessage(msg);
                    }
                }
            }
        }

        // ============================================================
        // 6. ОБРАБОТКА НОВЫХ СООБЩЕНИЙ
        // ============================================================
        async function processNewMessage(msg) {
            const chatId = String(msg.chat.id);
            const chatType = msg.chat.type;
            let userName = '';

            // Определяем имя
            if (chatType === 'private') {
                userName = msg.from?.first_name || msg.from?.username || 'User';
                if (msg.from?.last_name) userName += ' ' + msg.from.last_name;
            } else {
                userName = msg.chat.title || msg.from?.first_name || 'Chat';
            }

            // Получаем аватарку
            if (msg.from?.id) {
                try {
                    const photos = await callTelegramAPI('getUserProfilePhotos', { user_id: msg.from.id, limit: 1 });
                    if (photos.ok && photos.result?.total_count > 0) {
                        const fileId = photos.result.photos[0][0].file_id;
                        const file = await callTelegramAPI('getFile', { file_id: fileId });
                        if (file.ok) {
                            const avatarUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${file.result.file_path}`;
                            chatAvatars[String(msg.from.id)] = avatarUrl;
                        }
                    }
                } catch (e) { console.error('Avatar error:', e); }
            }

            // Определяем текст и тип медиа
            let text = msg.text || msg.caption || '';
            let mediaType = null;
            let mediaFileId = null;
            let mediaContent = '';

            if (msg.sticker) {
                mediaType = 'sticker';
                mediaFileId = msg.sticker.file_id;
                mediaContent = '😊 Стикер';
                text = msg.caption || '😊 Стикер';
            } else if (msg.photo) {
                mediaType = 'photo';
                mediaFileId = msg.photo[msg.photo.length - 1].file_id;
                mediaContent = '🖼 Фото';
                text = msg.caption || '🖼 Фото';
            } else if (msg.video) {
                mediaType = 'video';
                mediaFileId = msg.video.file_id;
                mediaContent = '🎥 Видео';
                text = msg.caption || '🎥 Видео';
            } else if (msg.video_note) {
                mediaType = 'video_note';
                mediaFileId = msg.video_note.file_id;
                mediaContent = '⭕ Кружок';
                text = '⭕ Кружок';
            } else if (msg.document) {
                mediaType = 'document';
                mediaFileId = msg.document.file_id;
                mediaContent = '📄 Документ';
                text = msg.caption || `📄 ${msg.document.file_name || 'Документ'}`;
            }

            // Добавляем в контакты
            const contact = {
                id: chatId,
                type: chatType === 'private' ? 'user' : 
                      (chatType === 'group' || chatType === 'supergroup') ? 'group' : 'channel',
                name: userName,
                username: msg.from?.username || msg.chat?.username || '',
                last: text || mediaContent || 'Сообщение',
                time: new Date(msg.date * 1000).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                unread: 1,
                date: msg.date,
                avatar: chatAvatars[String(msg.from?.id)] || null
            };

            const existing = contacts.find(c => c.id === contact.id);
            if (existing) {
                existing.last = contact.last;
                existing.time = contact.time;
                existing.unread = (existing.unread || 0) + 1;
                existing.date = contact.date;
                if (contact.avatar) existing.avatar = contact.avatar;
            } else {
                contacts.unshift(contact);
                showToast(`🆕 Новый контакт: ${contact.name}`);
            }

            // Сохраняем сообщение
            if (!messages[chatId]) {
                messages[chatId] = [];
            }

            const messageObj = {
                id: msg.message_id,
                text: text,
                sender: 'other',
                sender_name: msg.from?.first_name || msg.chat?.title || 'User',
                time: contact.time,
                date: msg.date,
                mediaType: mediaType,
                mediaFileId: mediaFileId,
                mediaContent: mediaContent
            };

            const exists = messages[chatId].find(m => m.id === messageObj.id);
            if (!exists) {
                messages[chatId].push(messageObj);
                if (messages[chatId].length > 100) {
                    messages[chatId].shift();
                }
            }

            saveData();
            renderChats();
            updateOnlineCount();

            if (currentChat && currentChat.id === chatId) {
                renderMessages(chatId);
            } else if (chatType === 'private') {
                const preview = text.length > 50 ? text.slice(0, 50) + '...' : text;
                showToast(`📩 ${userName}: ${preview}`);
            }
        }

        // ============================================================
        // 7. СОХРАНЕНИЕ ДАННЫХ
        // ============================================================
        function saveData() {
            try {
                localStorage.setItem('botContacts', JSON.stringify(contacts));
                localStorage.setItem('botMessages', JSON.stringify(messages));
                localStorage.setItem('botLastUpdate', String(lastUpdateId));
                localStorage.setItem('botAvatars', JSON.stringify(chatAvatars));
            } catch (e) {
                console.error('Save error:', e);
            }
        }

        function loadData() {
            try {
                const savedContacts = localStorage.getItem('botContacts');
                const savedMessages = localStorage.getItem('botMessages');
                const savedLastUpdate = localStorage.getItem('botLastUpdate');
                const savedAvatars = localStorage.getItem('botAvatars');

                if (savedContacts) contacts = JSON.parse(savedContacts);
                if (savedMessages) messages = JSON.parse(savedMessages);
                if (savedLastUpdate) lastUpdateId = parseInt(savedLastUpdate) || 0;
                if (savedAvatars) chatAvatars = JSON.parse(savedAvatars);
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        // ============================================================
        // 8. ОТОБРАЖЕНИЕ КОНТАКТОВ
        // ============================================================
        function renderChats() {
            const list = document.getElementById('chatsList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = contacts;
            
            if (currentTab !== 'all') {
                filtered = contacts.filter(c => c.type === currentTab);
            }
            
            if (search) {
                filtered = filtered.filter(c => 
                    c.name.toLowerCase().includes(search) || 
                    c.id.includes(search)
                );
            }

            filtered.sort((a, b) => {
                if ((a.unread || 0) > 0 && (b.unread || 0) === 0) return -1;
                if ((a.unread || 0) === 0 && (b.unread || 0) > 0) return 1;
                return (b.date || 0) - (a.date || 0);
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center;padding:30px 16px;color:var(--text-secondary);">
                        <div style="font-size:28px;margin-bottom:6px;">📭</div>
                        <div style="font-size:13px;">Нет контактов</div>
                        <div style="font-size:12px;margin-top:4px;">Кто-то напишет боту - появится здесь</div>
                        <button onclick="updateContacts()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:16px;background:var(--blue);color:white;cursor:pointer;font-size:13px;">🔄 Обновить</button>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(chat => {
                const isActive = currentChat && currentChat.id === chat.id;
                const typeEmoji = chat.type === 'group' ? '👥' : chat.type === 'channel' ? '📢' : '';
                const unread = chat.unread || 0;
                const avatar = chat.avatar || '';
                
                return `
                    <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${chat.id}')">
                        <div class="chat-avatar ${chat.type === 'group' ? 'group' : chat.type === 'channel' ? 'channel' : ''}">
                            ${avatar ? `<img src="${avatar}" alt="${chat.name}">` : 
                              (chat.type === 'user' ? (chat.name ? chat.name[0].toUpperCase() : '?') : typeEmoji)}
                        </div>
                        <div class="chat-info">
                            <div class="chat-name">${chat.name}</div>
                            <div class="chat-last">${chat.last || 'Новое сообщение'}</div>
                        </div>
                        <div class="chat-meta">
                            <div class="chat-time">${chat.time || ''}</div>
                            ${unread > 0 ? `<div class="chat-badge">${unread}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterChats() {
            renderChats();
        }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.sidebar-tabs .tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChats();
        }

        // ============================================================
        // 9. ОТКРЫТЬ ЧАТ
        // ============================================================
        function openChat(chatId) {
            const chat = contacts.find(c => c.id === chatId);
            if (!chat) {
                showToast('❌ Чат не найден');
                return;
            }

            currentChat = chat;
            chat.unread = 0;

            // Обновляем шапку
            const typeMap = { user: '👤 Личный', group: '👥 Группа', channel: '📢 Канал' };
            document.getElementById('chatTitle').textContent = chat.name;
            document.getElementById('chatSubtitle').textContent = typeMap[chat.type] || 'Чат';
            
            // Аватар в шапке
            const headerAvatar = document.getElementById('headerAvatar');
            if (chat.avatar) {
                headerAvatar.innerHTML = `<img src="${chat.avatar}" alt="${chat.name}">`;
            } else {
                headerAvatar.textContent = chat.type === 'user' ? (chat.name ? chat.name[0].toUpperCase() : '?') : 
                                          (chat.type === 'group' ? '👥' : '📢');
                headerAvatar.style.background = chat.type === 'group' ? 'var(--green)' : 
                                               chat.type === 'channel' ? 'var(--orange)' : 'var(--blue)';
            }

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('messagesContainer').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';

            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.chat-item').forEach(el => {
                if (el.textContent.includes(chat.name) || el.textContent.includes(chat.id)) {
                    el.classList.add('active');
                }
            });

            if (!messages[chatId]) {
                messages[chatId] = [];
            }
            renderMessages(chatId);

            saveData();

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('backBtn').classList.add('show');
            }

            setTimeout(() => {
                document.getElementById('messageInput').focus();
            }, 300);
        }

        function showChatList() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('show');
        }

        // ============================================================
        // 10. СООБЩЕНИЯ
        // ============================================================
        function renderMessages(chatId) {
            const container = document.getElementById('messagesContainer');
            const msgs = messages[chatId] || [];

            if (msgs.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;">
                        Нет сообщений
                    </div>
                `;
                return;
            }

            container.innerHTML = msgs.map(msg => {
                if (msg.sender === 'system') {
                    return `<div class="message system">${msg.text}</div>`;
                }
                const isOutgoing = msg.sender === 'me';
                const senderName = msg.sender_name || 'User';
                
                let mediaHtml = '';
                if (msg.mediaType) {
                    const mediaUrl = msg.mediaFileId ? 
                        `https://api.telegram.org/file/bot${BOT_TOKEN}/${msg.mediaFileId}` : '';
                    
                    if (msg.mediaType === 'sticker') {
                        mediaHtml = `<div class="media-content"><img src="${mediaUrl}" class="sticker" alt="Стикер"></div>`;
                    } else if (msg.mediaType === 'photo') {
                        mediaHtml = `<div class="media-content"><img src="${mediaUrl}" alt="Фото"></div>`;
                    } else if (msg.mediaType === 'video') {
                        mediaHtml = `<div class="media-content"><video controls><source src="${mediaUrl}"></video></div>`;
                    } else if (msg.mediaType === 'video_note') {
                        mediaHtml = `<div class="media-content"><video controls class="video-note" loop><source src="${mediaUrl}"></video></div>`;
                    } else if (msg.mediaType === 'document') {
                        mediaHtml = `<div class="media-content"><a href="${mediaUrl}" target="_blank" class="media-file">📄 ${msg.text || 'Документ'}</a></div>`;
                    }
                }
                
                const textContent = msg.text && !msg.text.match(/^(😊 Стикер|🖼 Фото|🎥 Видео|⭕ Кружок|📄)/) ? 
                    `<div class="media-caption">${msg.text}</div>` : '';
                
                return `
                    <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                        ${!isOutgoing && currentChat?.type === 'group' ? `<span class="msg-sender">${senderName}</span>` : ''}
                        ${mediaHtml}
                        ${textContent}
                        <span class="msg-time">${msg.time || 'сейчас'}</span>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        function addMessage(chatId, msg) {
            if (!messages[chatId]) messages[chatId] = [];
            messages[chatId].push(msg);
            if (currentChat && currentChat.id === chatId) {
                renderMessages(chatId);
            }
        }

        // ============================================================
        // 11. ОТПРАВКА СООБЩЕНИЙ
        // ============================================================
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 80) + 'px';
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentChat) return;

            const msg = {
                id: Date.now(),
                text: text,
                sender: 'me',
                time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                date: Date.now() / 1000
            };
            
            addMessage(currentChat.id, msg);
            
            input.value = '';
            input.style.height = 'auto';

            const contact = contacts.find(c => c.id === currentChat.id);
            if (contact) {
                contact.last = text;
                contact.time = 'сейчас';
                contact.date = Date.now() / 1000;
                renderChats();
                saveData();
            }

            const params = {
                chat_id: currentChat.id,
                text: text,
                parse_mode: 'HTML'
            };

            const result = await callTelegramAPI('sendMessage', params);

            if (!result.ok) {
                const msgs = messages[currentChat.id];
                const idx = msgs.findIndex(m => m.id === msg.id);
                if (idx !== -1) {
                    msgs[idx].text = `❌ ${result.description || 'Ошибка'}`;
                    msgs[idx].sender = 'system';
                }
                renderMessages(currentChat.id);
                showToast(`❌ ${result.description || 'Ошибка отправки'}`);
            }
        }

        // ============================================================
        // 12. ОТПРАВКА МЕДИА
        // ============================================================
        function openAttachModal() {
            if (!currentChat) {
                showToast('⚠️ Сначала выберите чат');
                return;
            }
            document.getElementById('attachModal').classList.add('show');
            document.getElementById('filePreview').textContent = '📤 Нажмите для выбора файла';
            document.getElementById('mediaPreview').innerHTML = '';
            document.getElementById('captionText').value = '';
            selectedFile = null;
            toggleAttachFields();
        }

        function toggleAttachFields() {
            const type = document.getElementById('attachType').value;
            const isVideoNote = type === 'video_note';
            const captionGroup = document.getElementById('captionGroup');
            captionGroup.style.display = (type === 'sticker' || type === 'video_note') ? 'none' : 'block';
        }

        function previewFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            selectedFile = file;
            const preview = document.getElementById('mediaPreview');
            const previewText = document.getElementById('filePreview');
            
            previewText.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<video controls><source src="${e.target.result}"></video>`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = `<div style="padding:20px;background:var(--bg-secondary);border-radius:8px;">📄 ${file.name}</div>`;
            }
        }

        async function sendMedia() {
            if (!selectedFile || !currentChat) {
                showToast('❌ Выберите файл');
                return;
            }

            const type = document.getElementById('attachType').value;
            const caption = document.getElementById('captionText').value.trim();

            const msg = {
                id: Date.now(),
                text: caption || (type === 'sticker' ? '😊 Стикер' : 
                                type === 'photo' ? '🖼 Фото' : 
                                type === 'video' ? '🎥 Видео' : 
                                type === 'video_note' ? '⭕ Кружок' : '📄 Документ'),
                sender: 'me',
                time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                date: Date.now() / 1000,
                mediaType: type,
                mediaContent: 'Отправка...'
            };

            addMessage(currentChat.id, msg);
            closeModal('attachModal');

            const result = await sendFileToTelegram(
                currentChat.id,
                selectedFile,
                type,
                caption
            );

            if (!result.ok) {
                const msgs = messages[currentChat.id];
                const idx = msgs.findIndex(m => m.id === msg.id);
                if (idx !== -1) {
                    msgs[idx].text = `❌ ${result.description || 'Ошибка отправки'}`;
                    msgs[idx].sender = 'system';
                }
                renderMessages(currentChat.id);
                showToast(`❌ ${result.description || 'Ошибка отправки'}`);
            } else {
                // Обновляем сообщение с реальными данными
                const msgs = messages[currentChat.id];
                const idx = msgs.findIndex(m => m.id === msg.id);
                if (idx !== -1) {
                    msgs[idx].mediaFileId = result.result[type]?.file_id || '';
                    msgs[idx].mediaContent = type;
                }
                renderMessages(currentChat.id);
                showToast('✅ Отправлено!');
            }

            // Обновляем контакт
            const contact = contacts.find(c => c.id === currentChat.id);
            if (contact) {
                contact.last = caption || '📎 Медиа';
                contact.time = 'сейчас';
                contact.date = Date.now() / 1000;
                renderChats();
                saveData();
            }

            document.getElementById('fileInput').value = '';
            selectedFile = null;
        }

        // ============================================================
        // 13. ОБНОВЛЕНИЕ КОНТАКТОВ
        // ============================================================
        async function updateContacts() {
            showToast('🔄 Обновление...');
            await getUpdates();
            renderChats();
            updateOnlineCount();
            showToast('✅ Обновлено');
        }

        function updateOnlineCount() {
            const count = contacts.filter(c => c.type === 'user').length;
            document.getElementById('onlineCount').textContent = count;
        }

        // ============================================================
        // 14. ТОСТ
        // ============================================================
        let toastTimeout = null;

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // 15. ТЕМА
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', html.getAttribute('data-theme'));
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // ============================================================
        // 16. МОДАЛИ
        // ============================================================
        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) el.classList.remove('show');
            });
        });

        // ============================================================
        // 17. АВТО-ОБНОВЛЕНИЕ
        // ============================================================
        function startAutoUpdate() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(async () => {
                await getUpdates();
                renderChats();
                updateOnlineCount();
            }, 5000);
        }

        // ============================================================
        // 18. ТЕЛЕГРАМ ИНТЕГРАЦИЯ
        // ============================================================
        if (tg) {
            const themeParams = tg.themeParams;
            if (themeParams) {
                document.documentElement.style.setProperty('--bg', themeParams.bg_color || '#ffffff');
                document.documentElement.style.setProperty('--text', themeParams.text_color || '#000000');
                document.documentElement.style.setProperty('--blue', themeParams.button_color || '#007aff');
            }
        }

        // ============================================================
        // 19. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            loadData();
            renderChats();
            updateOnlineCount();

            if (contacts.length > 0) {
                const unreadChat = contacts.find(c => c.unread > 0);
                if (unreadChat) {
                    openChat(unreadChat.id);
                } else {
                    openChat(contacts[0].id);
                }
            }

            startAutoUpdate();
            await getUpdates();
            renderChats();
            updateOnlineCount();

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('backBtn').classList.remove('show');
                }
            });
        });

        console.log('✅ Бот запущен!');
        console.log('🤖 Токен:', BOT_TOKEN);
        console.log('💬 Контактов:', contacts.length);
        console.log('📨 Сообщений:', Object.keys(messages).length);
        console.log('🖼 Поддержка медиа: ✅');
    </script>
</body>
</html>
