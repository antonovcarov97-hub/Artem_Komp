<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 Мой бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #ffffff;
            --bg-secondary: #f0f0f0;
            --bg-chat: #ffffff;
            --text: #000000;
            --text-secondary: #8e8e93;
            --border: #e5e5ea;
            --blue: #007aff;
            --green: #34c759;
            --red: #ff3b30;
            --orange: #ff9500;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg: #1c1c1e;
            --bg-secondary: #2c2c2e;
            --bg-chat: #1c1c1e;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --border: #38383a;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 50px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .header .back-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--blue);
            padding: 4px;
            display: none;
        }

        .header .back-btn.show {
            display: block;
        }

        .header .chat-header-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .header .chat-header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .header .chat-header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header .chat-header-text {
            flex: 1;
            min-width: 0;
        }

        .header .title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .header-actions button {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            color: var(--text);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            min-width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-search {
            padding: 8px 12px;
            flex-shrink: 0;
        }

        .sidebar-search input {
            width: 100%;
            padding: 8px 14px;
            border: none;
            border-radius: 20px;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .sidebar-search input::placeholder {
            color: var(--text-secondary);
        }

        .sidebar-tabs {
            display: flex;
            padding: 0 12px 6px;
            gap: 4px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-tabs .tab {
            flex: 1;
            padding: 5px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            background: none;
            border: none;
        }

        .sidebar-tabs .tab.active {
            color: var(--text);
            background: var(--bg);
            box-shadow: 0 1px 3px var(--shadow);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.15s;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .chat-item:hover {
            background: var(--bg);
        }

        .chat-item.active {
            background: var(--bg);
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--blue);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .chat-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-avatar.group {
            background: var(--green);
        }

        .chat-avatar.channel {
            background: var(--orange);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info .chat-name {
            font-weight: 500;
            font-size: 14px;
        }

        .chat-info .chat-last {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-meta {
            text-align: right;
            flex-shrink: 0;
        }

        .chat-meta .chat-time {
            font-size: 10px;
            color: var(--text-secondary);
        }

        .chat-meta .chat-badge {
            background: var(--blue);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 12px;
            margin-top: 2px;
            display: inline-block;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        .chat-area-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
        }

        .chat-area-empty .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-chat);
        }

        .message {
            max-width: 75%;
            padding: 7px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: messageIn 0.2s ease;
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.outgoing {
            align-self: flex-end;
            background: var(--blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.incoming {
            align-self: flex-start;
            background: var(--bg-secondary);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message .msg-time {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 3px;
            display: block;
            text-align: right;
        }

        .message.outgoing .msg-time {
            color: rgba(255,255,255,0.7);
        }

        .message .msg-sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--blue);
            margin-bottom: 2px;
            display: block;
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* ========== МЕДИА ========== */
        .message .media-content {
            margin: 4px 0;
            border-radius: 8px;
            overflow: hidden;
            max-width: 100%;
        }

        .message .media-content img,
        .message .media-content video {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: block;
        }

        .message .media-content .sticker {
            max-width: 128px;
            max-height: 128px;
            display: block;
        }

        .message .media-content .video-note {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
        }

        .message .media-caption {
            margin-top: 4px;
        }

        .message .media-file {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.05);
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            color: var(--text);
        }

        /* ========== ВВОД ========== */
        .input-area {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .input-area .input-wrapper {
            flex: 1;
            display: flex;
            background: var(--bg);
            border-radius: 20px;
            padding: 3px 3px 3px 14px;
            align-items: flex-end;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .input-area .input-wrapper:focus-within {
            border-color: var(--blue);
        }

        .input-area textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            padding: 7px 0;
            max-height: 80px;
            min-height: 18px;
            background: transparent;
            color: var(--text);
        }

        .input-area textarea::placeholder {
            color: var(--text-secondary);
        }

        .input-area .send-btn {
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-area .send-btn:active {
            transform: scale(0.9);
        }

        .input-area .attach-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 4px;
            flex-shrink: 0;
        }

        /* ========== МОДАЛ ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--bg);
            border-radius: 14px;
            padding: 20px;
            max-width: 400px;
            width: 92%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal h3 {
            margin-bottom: 14px;
            font-size: 17px;
        }

        .modal .form-group {
            margin-bottom: 12px;
        }

        .modal .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 3px;
        }

        .modal .form-group input,
        .modal .form-group select,
        .modal .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            font-family: inherit;
        }

        .modal .form-group .file-input {
            padding: 10px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .modal .form-group .file-input:hover {
            border-color: var(--blue);
        }

        .modal .form-group .file-input input[type="file"] {
            display: none;
        }

        .modal .btn-modal {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .modal .btn-modal.primary {
            background: var(--blue);
            color: white;
        }

        .modal .btn-modal.secondary {
            background: var(--bg-secondary);
            color: var(--text);
            margin-top: 6px;
        }

        .modal .media-preview {
            margin: 10px 0;
            text-align: center;
        }

        .modal .media-preview img,
        .modal .media-preview video {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 2000;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid var(--border);
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-width: unset;
                border-right: none;
            }
            .sidebar.hidden {
                display: none;
            }
            .chat-area {
                width: 100%;
            }
            .message {
                max-width: 85%;
            }
            .message .media-content .sticker {
                max-width: 96px;
                max-height: 96px;
            }
            .message .media-content .video-note {
                width: 100px;
                height: 100px;
            }
        }

        @media (min-width: 769px) {
            .sidebar {
                display: flex !important;
            }
        }

        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-left">
            <button class="back-btn" id="backBtn" onclick="showChatList()">‹</button>
            <div class="chat-header-info">
                <div class="chat-header-avatar" id="headerAvatar">🤖</div>
                <div class="chat-header-text">
                    <div class="title" id="chatTitle">Мой бот</div>
                    <div class="subtitle" id="chatSubtitle">Онлайн: <span id="onlineCount">0</span></div>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button onclick="forceUpdate()">🔄</button>
            <button onclick="toggleTheme()">🌓</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="🔍 Поиск..." oninput="filterChats()">
            </div>
            <div class="sidebar-tabs">
                <button class="tab active" onclick="switchTab('all', this)">Все</button>
                <button class="tab" onclick="switchTab('user', this)">👤 Контакты</button>
                <button class="tab" onclick="switchTab('group', this)">👥 Группы</button>
                <button class="tab" onclick="switchTab('channel', this)">📢 Каналы</button>
            </div>
            <div class="chats-list" id="chatsList"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-area-empty" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>Выберите чат</h3>
                <p>Выберите чат из списка слева</p>
            </div>
            <div class="messages-container" id="messagesContainer" style="display:none;"></div>
            <div class="input-area" id="inputArea" style="display:none;">
                <button class="attach-btn" onclick="openAttachModal()">📎</button>
                <div class="input-wrapper">
                    <textarea id="messageInput" rows="1" placeholder="Напишите сообщение..." oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- ========== МОДАЛ ВЛОЖЕНИЙ ========== -->
    <div class="modal-overlay" id="attachModal">
        <div class="modal">
            <h3>📎 Отправить медиа</h3>
            <div class="form-group">
                <label>Тип</label>
                <select id="attachType" onchange="toggleAttachFields()">
                    <option value="photo">🖼 Фото</option>
                    <option value="video">🎥 Видео</option>
                    <option value="sticker">😊 Стикер</option>
                    <option value="video_note">⭕ Кружок</option>
                    <option value="document">📄 Документ</option>
                </select>
            </div>
            <div class="form-group">
                <label>Файл</label>
                <div class="file-input" onclick="document.getElementById('fileInput').click()">
                    <div id="filePreview">📤 Нажмите для выбора файла</div>
                    <input type="file" id="fileInput" accept="image/*,video/*" onchange="previewFile(this)">
                </div>
            </div>
            <div class="media-preview" id="mediaPreview"></div>
            <div class="form-group" id="captionGroup">
                <label>Подпись</label>
                <textarea id="captionText" rows="2" placeholder="Введите подпись..."></textarea>
            </div>
            <button class="btn-modal primary" onclick="sendMedia()">📤 Отправить</button>
            <button class="btn-modal secondary" onclick="closeModal('attachModal')">Отмена</button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. КОНФИГУРАЦИЯ
        // ============================================================
        const BOT_TOKEN = "8953225877:AAFjsj8bJgMni7EkAM0L2w36xBBRR2tdDv8";

        // ============================================================
        // 2. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // ============================================================
        // 3. ДАННЫЕ
        // ============================================================
        let contacts = [];
        let messages = {};
        let currentChat = null;
        let currentTab = 'all';
        let lastUpdateId = 0;
        let updateInterval = null;
        let selectedFile = null;

        // ============================================================
        // 4. API ВЫЗОВЫ
        // ============================================================
        async function callTelegramAPI(method, params = {}) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/${method}`;
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(params)
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return { ok: false };
            }
        }

        // ============================================================
        // 5. ПОЛУЧЕНИЕ ОБНОВЛЕНИЙ
        // ============================================================
        async function getUpdates() {
            try {
                const params = { timeout: 30, allowed_updates: ['message', 'channel_post'] };
                if (lastUpdateId > 0) params.offset = lastUpdateId + 1;

                const result = await callTelegramAPI('getUpdates', params);
                
                if (result.ok && result.result) {
                    for (const update of result.result) {
                        lastUpdateId = Math.max(lastUpdateId, update.update_id);
                        const msg = update.message || update.channel_post;
                        if (msg) await processNewMessage(msg);
                    }
                    if (result.result.length > 0) {
                        renderChats();
                        updateOnlineCount();
                        if (currentChat) renderMessages(currentChat.id);
                    }
                }
            } catch (e) {
                console.error('Get updates error:', e);
            }
        }

        // ============================================================
        // 6. ОБРАБОТКА НОВЫХ СООБЩЕНИЙ
        // ============================================================
        async function processNewMessage(msg) {
            const chatId = String(msg.chat.id);
            const chatType = msg.chat.type;
            
            let userName = '';
            if (chatType === 'private') {
                userName = msg.from?.first_name || msg.from?.username || 'User';
                if (msg.from?.last_name) userName += ' ' + msg.from.last_name;
            } else {
                userName = msg.chat.title || msg.from?.first_name || 'Chat';
            }

            // Определяем тип медиа
            let mediaType = null;
            let mediaFileId = null;
            let text = msg.text || msg.caption || '';

            if (msg.sticker) {
                mediaType = 'sticker';
                mediaFileId = msg.sticker.file_id;
                text = '😊 Стикер';
            } else if (msg.photo) {
                mediaType = 'photo';
                mediaFileId = msg.photo[msg.photo.length - 1].file_id;
                text = msg.caption || '🖼 Фото';
            } else if (msg.video) {
                mediaType = 'video';
                mediaFileId = msg.video.file_id;
                text = msg.caption || '🎥 Видео';
            } else if (msg.video_note) {
                mediaType = 'video_note';
                mediaFileId = msg.video_note.file_id;
                text = '⭕ Кружок';
            } else if (msg.document) {
                mediaType = 'document';
                mediaFileId = msg.document.file_id;
                text = msg.caption || `📄 ${msg.document.file_name || 'Документ'}`;
            }

            // Добавляем в контакты
            const contact = {
                id: chatId,
                type: chatType === 'private' ? 'user' : 
                      (chatType === 'group' || chatType === 'supergroup') ? 'group' : 'channel',
                name: userName,
                last: text || 'Сообщение',
                time: new Date(msg.date * 1000).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                unread: currentChat?.id !== chatId ? 1 : 0,
                date: msg.date
            };

            const existing = contacts.find(c => c.id === contact.id);
            if (existing) {
                existing.last = contact.last;
                existing.time = contact.time;
                if (currentChat?.id !== chatId) existing.unread = (existing.unread || 0) + 1;
                existing.date = contact.date;
            } else {
                contacts.unshift(contact);
                showToast(`🆕 Новый контакт: ${contact.name}`);
            }

            // Сохраняем сообщение
            if (!messages[chatId]) messages[chatId] = [];
            
            const messageObj = {
                id: msg.message_id,
                text: text,
                sender: 'other',
                sender_name: msg.from?.first_name || msg.chat?.title || 'User',
                time: contact.time,
                date: msg.date,
                mediaType: mediaType,
                mediaFileId: mediaFileId
            };

            const exists = messages[chatId].find(m => m.id === messageObj.id);
            if (!exists) {
                messages[chatId].push(messageObj);
                if (messages[chatId].length > 200) messages[chatId].shift();
            }

            saveData();
            if (currentChat && currentChat.id === chatId) renderMessages(chatId);
        }

        // ============================================================
        // 7. СОХРАНЕНИЕ
        // ============================================================
        function saveData() {
            try {
                localStorage.setItem('botContacts', JSON.stringify(contacts));
                localStorage.setItem('botMessages', JSON.stringify(messages));
                localStorage.setItem('botLastUpdate', String(lastUpdateId));
            } catch (e) { console.error('Save error:', e); }
        }

        function loadData() {
            try {
                const savedContacts = localStorage.getItem('botContacts');
                const savedMessages = localStorage.getItem('botMessages');
                const savedLastUpdate = localStorage.getItem('botLastUpdate');
                if (savedContacts) contacts = JSON.parse(savedContacts);
                if (savedMessages) messages = JSON.parse(savedMessages);
                if (savedLastUpdate) lastUpdateId = parseInt(savedLastUpdate) || 0;
            } catch (e) { console.error('Load error:', e); }
        }

        // ============================================================
        // 8. ОТОБРАЖЕНИЕ
        // ============================================================
        function renderChats() {
            const list = document.getElementById('chatsList');
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = contacts;
            if (currentTab !== 'all') {
                filtered = contacts.filter(c => c.type === currentTab);
            }
            if (search) {
                filtered = filtered.filter(c => 
                    c.name.toLowerCase().includes(search) || c.id.includes(search)
                );
            }

            filtered.sort((a, b) => {
                if ((a.unread || 0) > 0 && (b.unread || 0) === 0) return -1;
                if ((a.unread || 0) === 0 && (b.unread || 0) > 0) return 1;
                return (b.date || 0) - (a.date || 0);
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center;padding:30px 16px;color:var(--text-secondary);">
                        <div style="font-size:28px;margin-bottom:6px;">📭</div>
                        <div style="font-size:13px;">Нет контактов</div>
                        <button onclick="forceUpdate()" style="margin-top:8px;padding:6px 16px;border:none;border-radius:16px;background:var(--blue);color:white;cursor:pointer;">🔄 Обновить</button>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(chat => {
                const isActive = currentChat && currentChat.id === chat.id;
                const typeEmoji = chat.type === 'group' ? '👥' : chat.type === 'channel' ? '📢' : '';
                const unread = chat.unread || 0;
                
                return `
                    <div class="chat-item ${isActive ? 'active' : ''}" onclick="openChat('${chat.id}')">
                        <div class="chat-avatar ${chat.type === 'group' ? 'group' : chat.type === 'channel' ? 'channel' : ''}">
                            ${chat.type === 'user' ? (chat.name ? chat.name[0].toUpperCase() : '?') : typeEmoji}
                        </div>
                        <div class="chat-info">
                            <div class="chat-name">${chat.name}</div>
                            <div class="chat-last">${chat.last || 'Новое сообщение'}</div>
                        </div>
                        <div class="chat-meta">
                            <div class="chat-time">${chat.time || ''}</div>
                            ${unread > 0 ? `<div class="chat-badge">${unread}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterChats() { renderChats(); }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.sidebar-tabs .tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderChats();
        }

        // ============================================================
        // 9. ОТКРЫТЬ ЧАТ
        // ============================================================
        function openChat(chatId) {
            const chat = contacts.find(c => c.id === chatId);
            if (!chat) { showToast('❌ Чат не найден'); return; }

            currentChat = chat;
            chat.unread = 0;

            document.getElementById('chatTitle').textContent = chat.name;
            const typeMap = { user: '👤 Личный', group: '👥 Группа', channel: '📢 Канал' };
            document.getElementById('chatSubtitle').textContent = typeMap[chat.type] || 'Чат';
            
            const headerAvatar = document.getElementById('headerAvatar');
            headerAvatar.textContent = chat.type === 'user' ? (chat.name ? chat.name[0].toUpperCase() : '?') : 
                                      (chat.type === 'group' ? '👥' : '📢');
            headerAvatar.style.background = chat.type === 'group' ? 'var(--green)' : 
                                           chat.type === 'channel' ? 'var(--orange)' : 'var(--blue)';

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('messagesContainer').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';

            if (!messages[chatId]) messages[chatId] = [];
            renderMessages(chatId);
            saveData();

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('backBtn').classList.add('show');
            }

            setTimeout(() => document.getElementById('messageInput').focus(), 300);
        }

        function showChatList() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('backBtn').classList.remove('show');
        }

        // ============================================================
        // 10. СООБЩЕНИЯ
        // ============================================================
        function renderMessages(chatId) {
            const container = document.getElementById('messagesContainer');
            const msgs = messages[chatId] || [];

            if (msgs.length === 0) {
                container.innerHTML = `<div style="text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;">Нет сообщений</div>`;
                return;
            }

            container.innerHTML = msgs.map(msg => {
                if (msg.sender === 'system') {
                    return `<div class="message system">${msg.text}</div>`;
                }
                const isOutgoing = msg.sender === 'me';
                const senderName = msg.sender_name || 'User';
                
                // Генерируем ссылку на медиа
                let mediaHtml = '';
                if (msg.mediaType && msg.mediaFileId) {
                    // Прямая ссылка на файл через Telegram
                    const mediaUrl = `https://api.telegram.org/file/bot${BOT_TOKEN}/${msg.mediaFileId}`;
                    // Но мы не можем получить file_path, поэтому используем другой подход
                    // Для стикеров и фото используем прямой метод
                    if (msg.mediaType === 'sticker') {
                        mediaHtml = `<div class="media-content"><img src="https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${msg.mediaFileId}" class="sticker" alt="Стикер" onerror="this.alt='😊 Стикер';this.style.fontSize='32px';this.style.textAlign='center'"></div>`;
                    } else if (msg.mediaType === 'photo') {
                        mediaHtml = `<div class="media-content"><img src="https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${msg.mediaFileId}" alt="Фото" onerror="this.alt='🖼 Фото';this.style.fontSize='32px';this.style.textAlign='center'"></div>`;
                    } else if (msg.mediaType === 'video') {
                        mediaHtml = `<div class="media-content"><video controls preload="none" onerror="this.style.display='none'"><source src="https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${msg.mediaFileId}"></video></div>`;
                    } else if (msg.mediaType === 'video_note') {
                        mediaHtml = `<div class="media-content"><video controls class="video-note" loop preload="none" onerror="this.style.display='none'"><source src="https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${msg.mediaFileId}"></video></div>`;
                    } else if (msg.mediaType === 'document') {
                        mediaHtml = `<div class="media-content"><a href="https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${msg.mediaFileId}" target="_blank" class="media-file">📄 ${msg.text || 'Документ'}</a></div>`;
                    }
                }
                
                const textContent = msg.text && !msg.text.match(/^(😊 Стикер|🖼 Фото|🎥 Видео|⭕ Кружок|📄)/) ? 
                    `<div class="media-caption">${msg.text}</div>` : '';
                
                return `
                    <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                        ${!isOutgoing && currentChat?.type === 'group' ? `<span class="msg-sender">${senderName}</span>` : ''}
                        ${mediaHtml}
                        ${textContent}
                        <span class="msg-time">${msg.time || 'сейчас'}</span>
                    </div>
                `;
            }).join('');

            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // 11. ОТПРАВКА СООБЩЕНИЙ
        // ============================================================
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 80) + 'px';
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChat) return;

            const msg = {
                id: Date.now(),
                text: text,
                sender: 'me',
                time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                date: Date.now() / 1000
            };
            
            if (!messages[currentChat.id]) messages[currentChat.id] = [];
            messages[currentChat.id].push(msg);
            renderMessages(currentChat.id);
            
            input.value = '';
            input.style.height = 'auto';

            const contact = contacts.find(c => c.id === currentChat.id);
            if (contact) {
                contact.last = text;
                contact.time = 'сейчас';
                contact.date = Date.now() / 1000;
                renderChats();
                saveData();
            }

            const result = await callTelegramAPI('sendMessage', {
                chat_id: currentChat.id,
                text: text,
                parse_mode: 'HTML'
            });

            if (!result.ok) {
                const msgs = messages[currentChat.id];
                const idx = msgs.findIndex(m => m.id === msg.id);
                if (idx !== -1) {
                    msgs[idx].text = `❌ ${result.description || 'Ошибка'}`;
                    msgs[idx].sender = 'system';
                }
                renderMessages(currentChat.id);
                showToast(`❌ ${result.description || 'Ошибка отправки'}`);
            }
        }

        // ============================================================
        // 12. ОТПРАВКА МЕДИА
        // ============================================================
        function openAttachModal() {
            if (!currentChat) { showToast('⚠️ Сначала выберите чат'); return; }
            document.getElementById('attachModal').classList.add('show');
            document.getElementById('filePreview').textContent = '📤 Нажмите для выбора файла';
            document.getElementById('mediaPreview').innerHTML = '';
            document.getElementById('captionText').value = '';
            selectedFile = null;
            document.getElementById('fileInput').value = '';
            toggleAttachFields();
        }

        function toggleAttachFields() {
            const type = document.getElementById('attachType').value;
            document.getElementById('captionGroup').style.display = 
                (type === 'sticker' || type === 'video_note') ? 'none' : 'block';
        }

        function previewFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            selectedFile = file;
            const preview = document.getElementById('mediaPreview');
            document.getElementById('filePreview').textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                };
                reader.readAsDataURL(file);
            } else if (file.type.startsWith('video/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML = `<video controls><source src="${e.target.result}"></video>`;
                };
                reader.readAsDataURL(file);
            } else {
                preview.innerHTML = `<div style="padding:20px;background:var(--bg-secondary);border-radius:8px;">📄 ${file.name}</div>`;
            }
        }

        async function sendMedia() {
            if (!selectedFile || !currentChat) { showToast('❌ Выберите файл'); return; }

            const type = document.getElementById('attachType').value;
            const caption = document.getElementById('captionText').value.trim();

            const msg = {
                id: Date.now(),
                text: caption || (type === 'sticker' ? '😊 Стикер' : 
                                type === 'photo' ? '🖼 Фото' : 
                                type === 'video' ? '🎥 Видео' : 
                                type === 'video_note' ? '⭕ Кружок' : '📄 Документ'),
                sender: 'me',
                time: new Date().toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' }),
                date: Date.now() / 1000,
                mediaType: type,
                mediaFileId: null
            };

            if (!messages[currentChat.id]) messages[currentChat.id] = [];
            messages[currentChat.id].push(msg);
            renderMessages(currentChat.id);
            closeModal('attachModal');

            // Отправляем файл
            const formData = new FormData();
            formData.append('chat_id', currentChat.id);
            
            const methodMap = {
                'photo': 'sendPhoto',
                'video': 'sendVideo',
                'sticker': 'sendSticker',
                'video_note': 'sendVideoNote',
                'document': 'sendDocument'
            };

            const method = methodMap[type] || 'sendDocument';
            const fieldName = type === 'video_note' ? 'video_note' : type;
            formData.append(fieldName, selectedFile);
            if (caption && type !== 'sticker' && type !== 'video_note') {
                formData.append('caption', caption);
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${method}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (!result.ok) {
                    const msgs = messages[currentChat.id];
                    const idx = msgs.findIndex(m => m.id === msg.id);
                    if (idx !== -1) {
                        msgs[idx].text = `❌ ${result.description || 'Ошибка отправки'}`;
                        msgs[idx].sender = 'system';
                    }
                    renderMessages(currentChat.id);
                    showToast(`❌ ${result.description || 'Ошибка отправки'}`);
                } else {
                    // Получаем file_id
                    let fileId = null;
                    if (result.result) {
                        if (type === 'photo') {
                            fileId = result.result.photo?.[result.result.photo.length - 1]?.file_id;
                        } else if (type === 'sticker') {
                            fileId = result.result.sticker?.file_id;
                        } else if (type === 'video') {
                            fileId = result.result.video?.file_id;
                        } else if (type === 'video_note') {
                            fileId = result.result.video_note?.file_id;
                        } else if (type === 'document') {
                            fileId = result.result.document?.file_id;
                        }
                    }

                    if (fileId) {
                        const msgs = messages[currentChat.id];
                        const idx = msgs.findIndex(m => m.id === msg.id);
                        if (idx !== -1) {
                            msgs[idx].mediaFileId = fileId;
                        }
                        renderMessages(currentChat.id);
                    }
                    showToast('✅ Отправлено!');
                }
            } catch (error) {
                showToast('❌ Ошибка отправки');
                console.error('Send media error:', error);
            }

            const contact = contacts.find(c => c.id === currentChat.id);
            if (contact) {
                contact.last = caption || '📎 Медиа';
                contact.time = 'сейчас';
                contact.date = Date.now() / 1000;
                renderChats();
                saveData();
            }

            document.getElementById('fileInput').value = '';
            selectedFile = null;
        }

        // ============================================================
        // 13. ОБНОВЛЕНИЕ
        // ============================================================
        async function forceUpdate() {
            showToast('🔄 Обновление...');
            await getUpdates();
            renderChats();
            updateOnlineCount();
            if (currentChat) renderMessages(currentChat.id);
            showToast('✅ Обновлено');
        }

        function updateOnlineCount() {
            document.getElementById('onlineCount').textContent = contacts.filter(c => c.type === 'user').length;
        }

        // ============================================================
        // 14. ТОСТ
        // ============================================================
        let toastTimeout = null;

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // 15. ТЕМА
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', html.getAttribute('data-theme'));
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        // ============================================================
        // 16. МОДАЛИ
        // ============================================================
        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', (e) => {
                if (e.target === el) el.classList.remove('show');
            });
        });

        // ============================================================
        // 17. АВТО-ОБНОВЛЕНИЕ
        // ============================================================
        function startAutoUpdate() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(async () => {
                await getUpdates();
                renderChats();
                updateOnlineCount();
                if (currentChat) renderMessages(currentChat.id);
            }, 3000);
        }

        // ============================================================
        // 18. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', async () => {
            loadData();
            renderChats();
            updateOnlineCount();

            if (contacts.length > 0) {
                const unreadChat = contacts.find(c => c.unread > 0);
                openChat(unreadChat ? unreadChat.id : contacts[0].id);
            }

            startAutoUpdate();
            await getUpdates();
            renderChats();
            updateOnlineCount();
            if (currentChat) renderMessages(currentChat.id);

            window.addEventListener('resize', () => {
                if (window.innerWidth > 768) {
                    document.getElementById('sidebar').classList.remove('hidden');
                    document.getElementById('backBtn').classList.remove('show');
                }
            });
        });

        console.log('✅ Бот запущен!');
        console.log('🤖 Токен:', BOT_TOKEN);
        console.log('💬 Контактов:', contacts.length);
        console.log('🔄 Авто-обновление: 3 сек');
    </script>
</body>
</html>
